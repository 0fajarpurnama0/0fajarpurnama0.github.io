<button class="button" onclick="window.open('{{ 'coin' | relative_url }}')">
    Get <img style="height: 1em; border-radius:50%;" src="{{ '/assets/images/icon/0fp0exp-logo-square.png' | relative_url }}"/>
</button>

<!-- Container around the dynamic connection text, keeping toggle logic separate from JS dynamic updates -->
<button class="button" onclick="widget_show_dapp_wallet_menu()" id="connect_dapp_toggle">
    <span id="connect_status_text">Connect &#128179;</span>
</button>

<div class="wallet-status" style="font-size: 0.8rem; margin-top: 5px; color: black;">
    <span id="showAccount"></span>
    <span id="fajarpurnamatokenbalance"></span>
</div>

<div id="widget_connect_dapp_wallet_menu" style="display: none;">
    
    <h3>Connect Wallet</h3>
    <!-- Added explicit styling to close button for clarity -->
    <button onclick="widget_show_dapp_wallet_menu()" style="float: right; cursor: pointer; border: none; background: transparent;">&#10060;</button>
    <div style="clear:both;"></div>

    <div class="grid_dapp_wallet_list">
        {% for item in site.data.dapp_wallet_connect_list %}
        <!-- Clicking Div triggers main connection logic from YAML config -->
        <div onclick="{{ item.onclick }}; widget_show_dapp_wallet_menu()" id="{{ item.id }}" style="cursor: pointer;">
            <img src="{{ item.src | relative_url }}" alt="{{ item.name }}" onerror="this.onerror=null;this.src='{{ item.srconerror | relative_url }}';"/>
            <p>{{ item.description }}</p>
            
            <!-- ADDED event.stopPropagation() to prevent div click when clicking button -->
            <button class="button" onclick="{{ item.watchasset }}; event.stopPropagation();" style="font-size: 0.8rem !important; padding: 2px 8px; cursor: pointer;">
                Add Token
            </button>
        </div>
        {% endfor %}
    </div>
</div>

<script>
function widget_show_dapp_wallet_menu(){
    const menu = document.getElementById("widget_connect_dapp_wallet_menu");
    // getComputedStyle is slow, direct inline display check is safer
    if(menu.style.display != "none"){
        menu.style.display = "none";
    } else {
        menu.style.display = "block";
    }
}
</script>
